<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سایت احسان</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
    }

    header {
      background: #222;
      color: white;
      padding: 60px 20px;
    }

    main {
      padding: 40px 20px;
    }

    .box {
      max-width: 600px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <header>
    <h1>سلام، به سایت احسان خوش آمدید 👋</h1>
    <p>این اولین سایت من است</p>
  </header>

  <main>
    <div class="box">
      <h2>درباره سایت</h2>
      <p>این سایت با HTML و GitHub Pages ساخته شده است.</p>

      <button onclick="alert('سلام احسان 😄')">
        کلیک کن
      </button>
    </div>
  </main>
</body>
</html>
